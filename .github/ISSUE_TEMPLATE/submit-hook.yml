---
name: Submit a hook
description: Propose a Uniswap v4 hook product for the directory. One product per issue, not a raw address dump.
title: "[hook] "
labels: ["hook"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer a pull request: copy `hooks/_template.yml` to `hooks/{slug}.yml` with a GitHub permalink and Solidity excerpt. This form is for discussion. Listing is not an audit.
  - type: input
    id: name
    attributes:
      label: Hook name
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: What job does it do?
      description: Which callbacks, what they change. Unique prose. Include a GitHub .sol permalink.
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Website or repo (https)
    validations:
      required: true
  - type: input
    id: chains
    attributes:
      label: Chains
      placeholder: base, ethereum, robinhood
  - type: checkboxes
    id: not-hooklist
    attributes:
      label: Confirm
      options:
        - label: This is a hook contract listing with public Solidity, not a Uniswap/hooklist address dump.
          required: true
        - label: I have not invented contract addresses.
          required: true
