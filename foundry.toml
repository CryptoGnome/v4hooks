[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# v4-core vendors its own forge-std; skip it so CI does not compile two Test bases.
skip = ["lib/uniswap-hooks/lib/v4-core/lib/forge-std/**"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false
fs_permissions = [{ access = "read", path = "./"}]
gas_limit = 300000000

[fuzz]
runs = 256

[lint]
lint_on_build = false
