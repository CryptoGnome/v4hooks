slug: back-geo-oracle
name: BackGeoOracle
kind: pattern
tagline: Geomean oracle that backruns its own pool so the recorded price is not stale.
description: |
  A geometric-mean TWAP oracle that solves the usual problem with in-pool oracles: the
  price you record is the price after someone traded against you, which is exactly the
  price an attacker chose. BackGeoOracle answers that by backrunning the swap itself in
  afterSwap and recording the corrected price, so the observation reflects a rebalanced
  pool rather than the post-trade extreme.

  Permissions are wide but each one is doing something specific. beforeInitialize is a
  configuration gate: it reverts unless fee is 0 and tickSpacing is MAX_TICK_SPACING, so
  only one oracle pool can exist per pair and liquidity cannot fragment.
  afterInitialize seeds the observation array. beforeAddLiquidity rejects anything that
  is not full range — minUsableTick to maxUsableTick — and updates the pool first;
  beforeRemoveLiquidity updates too, so observations stay current across liquidity moves.

  beforeSwap reverts on exact-output swaps (only exactIn is supported) and refreshes the
  pool. The interesting one is afterSwap, which calls _backrun to compute a corrective
  delta, then settles it with afterSwapReturnDelta — inverting zeroForOne and the sign of
  amountSpecified while keeping the specified currency the same. The fee for that
  correction is charged in the unspecified currency, the one the user is buying.

  Every callback is onlyPoolManager. The full-range and zero-fee constraints mean this is
  a purpose-built oracle pool, not a hook you bolt onto a trading pool.

  RigoBlock has an audit for this one — linked below — which makes it unusual among
  research-grade oracle hooks. Read the report, not just the excerpt.
