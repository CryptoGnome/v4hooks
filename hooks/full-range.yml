slug: full-range
name: Full range
kind: pattern
tagline: "Force v2-style full-range LP: only the hook can modify liquidity, users mint a pool ERC20 instead."
description: |
  FullRange’s beforeInitialize requires tickSpacing 60 and deploys a per-pool ERC20 receipt.
  beforeAddLiquidity reverts unless sender is the hook, so LPs must call addLiquidity on the
  hook (min to max tick). beforeSwap marks that fees have accrued. This is how you wrap a v4
  pool as constant-product inventory. UNLICENSED Uniswap example — take the full file, including
  rebalance/donate dust. Listing is not an audit.
source:
  repo: https://github.com/Uniswap/v4-periphery
  path: contracts/hooks/examples/FullRange.sol
  url: https://github.com/Uniswap/v4-periphery/blob/example-contracts/contracts/hooks/examples/FullRange.sol
solidity: |
  // SPDX-License-Identifier: UNLICENSED
  function getHookPermissions() public pure override returns (Hooks.Permissions memory) {
      return Hooks.Permissions({
          beforeInitialize: true,
          afterInitialize: false,
          beforeAddLiquidity: true,
          beforeRemoveLiquidity: false,
          afterAddLiquidity: false,
          afterRemoveLiquidity: false,
          beforeSwap: true,
          afterSwap: false,
          beforeDonate: false,
          afterDonate: false,
          beforeSwapReturnDelta: false,
          afterSwapReturnDelta: false,
          afterAddLiquidityReturnDelta: false,
          afterRemoveLiquidityReturnDelta: false
      });
  }

  function beforeAddLiquidity(
      address sender,
      PoolKey calldata,
      IPoolManager.ModifyLiquidityParams calldata,
      bytes calldata
  ) external view override returns (bytes4) {
      if (sender != address(this)) revert SenderMustBeHook();
      return FullRange.beforeAddLiquidity.selector;
  }
