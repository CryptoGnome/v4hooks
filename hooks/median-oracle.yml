slug: median-oracle
name: Median oracle
kind: pattern
tagline: Ring buffer of post-swap ticks with onchain medianTick view.
description: |
  First-party rewrite inspired by saucepoint median-oracles (MIT). afterSwap pushes floored tick
  into a 16-sample ring per pool. medianTick sorts the active window on read — teaching cut of a
  manipulation-resistant oracle vs TWAP geomean examples. Experimental. Listing is not an audit.
source:
  repo: https://github.com/CryptoGnome/v4hooks
  path: contracts/MedianOracle.sol
  url: https://github.com/CryptoGnome/v4hooks/blob/main/contracts/MedianOracle.sol
solidity: |
  function getHookPermissions() public pure override returns (Hooks.Permissions memory) {
      return Hooks.Permissions({
          beforeInitialize: false,
          afterInitialize: false,
          beforeAddLiquidity: false,
          afterAddLiquidity: false,
          beforeRemoveLiquidity: false,
          afterRemoveLiquidity: false,
          beforeSwap: false,
          afterSwap: true,
          beforeDonate: false,
          afterDonate: false,
          beforeSwapReturnDelta: false,
          afterSwapReturnDelta: false,
          afterAddLiquidityReturnDelta: false,
          afterRemoveLiquidityReturnDelta: false
      });
  }
categories:
  - oracles
