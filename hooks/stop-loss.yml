slug: stop-loss
name: Stop-loss
kind: pattern
tagline: Tick-walk fill-on-cross stop loss via unlock-wrapped market sells.
description: |
  First-party rewrite of saucepoint v4-stoploss (MIT). afterInitialize snapshots tickLowerLast.
  registerStop records size at a trigger tick. afterSwap walks downward crosses and fillStopLoss
  runs an unlock-wrapped market sell. Uses 14 permission fields and OpenZeppelin BaseHook.
  Simplified vs original: no ERC1155 receipts. Experimental teaching hook. Listing is not an audit.
  Forge tests under test/StopLoss.t.sol.
source:
  repo: https://github.com/CryptoGnome/v4hooks
  path: contracts/StopLoss.sol
  url: https://github.com/CryptoGnome/v4hooks/blob/main/contracts/StopLoss.sol
solidity: |
  function getHookPermissions() public pure override returns (Hooks.Permissions memory) {
      return Hooks.Permissions({
          beforeInitialize: false,
          afterInitialize: true,
          beforeAddLiquidity: false,
          afterAddLiquidity: false,
          beforeRemoveLiquidity: false,
          afterRemoveLiquidity: false,
          beforeSwap: false,
          afterSwap: true,
          beforeDonate: false,
          afterDonate: false,
          beforeSwapReturnDelta: false,
          afterSwapReturnDelta: false,
          afterAddLiquidityReturnDelta: false,
          afterRemoveLiquidityReturnDelta: false
      });
  }
