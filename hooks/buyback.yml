slug: buyback
name: Buyback
kind: pattern
tagline: Treasury-funded market buy when pool tick is at or below thresholdTick.
description: |
  First-party rewrite inspired by atj3097/buyback-hook. Native-pair pool; fund the hook with ETH.
  setThreshold stores a tick floor; buyback() unlocks a zeroForOne swap when current tick <= threshold.
  Fixed ungated-callback issues from the legacy repo. Experimental. Listing is not an audit.
