slug: trailing-stop
name: Trailing stop
kind: pattern
tagline: Peak-tick trailing stop with trail fee on sells after retrace.
description: |
  First-party rewrite inspired by Hookathon C1 Trailing Hook. armTrail sets peak tick per trader.
  afterSwap updates peak on buys; beforeSwap applies TRAIL_FEE when a sell retraces trailDistance
  ticks from peak. Dynamic fee pool with OVERRIDE_FEE_FLAG. Experimental. Listing is not an audit.
source:
  repo: https://github.com/CryptoGnome/v4hooks
  path: contracts/TrailingStop.sol
  url: https://github.com/CryptoGnome/v4hooks/blob/main/contracts/TrailingStop.sol
solidity: |
  function getHookPermissions() public pure override returns (Hooks.Permissions memory) {
      return Hooks.Permissions({
          beforeInitialize: false,
          afterInitialize: true,
          beforeAddLiquidity: false,
          afterAddLiquidity: false,
          beforeRemoveLiquidity: false,
          afterRemoveLiquidity: false,
          beforeSwap: true,
          afterSwap: true,
          beforeDonate: false,
          afterDonate: false,
          beforeSwapReturnDelta: false,
          afterSwapReturnDelta: false,
          afterAddLiquidityReturnDelta: false,
          afterRemoveLiquidityReturnDelta: false
      });
  }
categories:
  - limit-orders
chains:
  - ethereum
license: MIT
flags:
  - afterInitialize
  - beforeSwap
  - afterSwap
properties:
  - dynamic-fee
  - custom-swap-data
  - vanilla-swap
status: experimental
