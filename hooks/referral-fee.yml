slug: referral-fee
name: Referral fee
kind: pattern
tagline: abi.encode(referrer) in hookData pays refBps of swap output to the referrer.
description: |
  First-party rewrite inspired by mergd/ref-fee-hook (MIT). afterSwapReturnDelta takes refBps of
  output token and transfers to the referrer decoded from hookData. Zero referrer skips the skim.
  Experimental referral split pattern. Listing is not an audit. Forge tests under test/ReferralFee.t.sol.
source:
  repo: https://github.com/CryptoGnome/v4hooks
  path: contracts/ReferralFee.sol
  url: https://github.com/CryptoGnome/v4hooks/blob/main/contracts/ReferralFee.sol
solidity: |
  function getHookPermissions() public pure override returns (Hooks.Permissions memory) {
      return Hooks.Permissions({
          beforeInitialize: false,
          afterInitialize: false,
          beforeAddLiquidity: false,
          afterAddLiquidity: false,
          beforeRemoveLiquidity: false,
          afterRemoveLiquidity: false,
          beforeSwap: false,
          afterSwap: true,
          beforeDonate: false,
          afterDonate: false,
          beforeSwapReturnDelta: false,
          afterSwapReturnDelta: true,
          afterAddLiquidityReturnDelta: false,
          afterRemoveLiquidityReturnDelta: false
      });
  }
categories:
  - creator-economy
chains:
  - ethereum
license: MIT
flags:
  - afterSwap
  - afterSwapReturnDelta
properties:
