slug: zora-creator
name: Zora creator hook
tagline: Creator-coin launch rails with fee conversion and reward split.
description: |
  Zora’s creator hook is the v4 surface behind creator coins: it converts swap fees into a payout token and distributes rewards without a custom off-chain splitter. If you are looking for a Uniswap v4 hook already used by a large creator network, this is the reference, not a toy example from a hackathon.

  Deployments span Zora’s own chain and other Uniswap v4 venues. Confirm which address your app should call via Uniswap/hooklist and Zora docs. v4hooks lists the product once so agents and humans do not have to dedupe a dozen Post Hook versions by hand.
