slug: zora-coin-hook
name: Zora Coin Hook
kind: product
tagline: "Creator coin hook: launch fee decay, LP positions on init, fee swap + reward distribution."
description: |
  ZoraV4CoinHook is Zora production code. On pool init it seeds multi-range LP from coin config.
  beforeSwap returns a dynamic launch fee that decays from ~99% to 1% over ~10 seconds after coin
  creation (LAUNCH_FEE_START → LP_FEE_V4). afterSwap collects LP fees, swaps to backing currency,
  and distributes rewards. Supports hook upgrades via IUpgradeableV4Hook migration paths. Use Zora's
  factory — do not reimplement to launch a coin. Excerpt shows permissions and launch fee calc.
  Full file at the permalink. Listing is not an audit.
