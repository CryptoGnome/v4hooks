slug: constant-sum
name: Constant sum
kind: pattern
tagline: Replace xy=k with x+y=k so every swap fills exactly 1:1, using a NoOp beforeSwap.
description: |
  The cleanest example of a v4 custom curve. The pool's own math is never used — the hook
  intercepts the swap in beforeSwap, returns a BeforeSwapDelta that fully accounts for
  both sides, and the PoolManager skips its concentrated-liquidity swap entirely. That is
  what beforeSwapReturnDelta buys you, and this is the smallest readable demonstration
  of it.

  The swap body is short. It picks input and output currency from zeroForOne, treats a
  negative amountSpecified as exact-input, and — because the curve is x+y=k — uses the
  same amount for both sides. It then calls poolManager.mint to take the input currency
  as ERC-6909 into the hook's reserves and poolManager.burn to pay the output currency
  out of them. The returned delta is the mirror of that: for exact input the specified
  delta is positive and the unspecified negative, and for exact output the signs invert.
  The comments in the file spell the sign convention out line by line, which is the part
  worth reading twice — getting it backwards is the classic custom-curve bug.

  beforeAddLiquidity reverts with "No v4 Liquidity allowed". That is deliberate, not an
  oversight: reserves live in the hook as ERC-6909 claims, so ordinary v4 liquidity would
  be stranded and unusable by the curve. Any custom-curve hook has to make the same
  choice.

  Note the file is named Counter.sol — leftover from the v4-template scaffold — even
  though the contract does constant-sum swaps. Unaudited example code.
source:
  repo: https://github.com/saucepoint/v4-constant-sum
  path: src/Counter.sol
