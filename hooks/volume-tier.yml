slug: volume-tier
name: Volume tier
kind: pattern
tagline: Cumulative swap notional unlocks lower dynamic fees for high-volume traders.
description: |
  First-party rewrite inspired by EthLondon Royalty Swap (Keinberger/royalty-swap). afterSwap
  accumulates amountSpecified notional per trader (hookData address). beforeSwap returns tiered
  fee with OVERRIDE_FEE_FLAG at tier1/tier2 breakpoints. Distinct from SuckerPunch hold-time fees
  and SurgeFee size/liquidity scaling. Experimental. Listing is not an audit.
source:
  repo: https://github.com/CryptoGnome/v4hooks
  path: contracts/VolumeTier.sol
  url: https://github.com/CryptoGnome/v4hooks/blob/main/contracts/VolumeTier.sol
solidity: |
  function getHookPermissions() public pure override returns (Hooks.Permissions memory) {
      return Hooks.Permissions({
          beforeInitialize: false,
          afterInitialize: true,
          beforeAddLiquidity: false,
          afterAddLiquidity: false,
          beforeRemoveLiquidity: false,
          afterRemoveLiquidity: false,
          beforeSwap: true,
          afterSwap: true,
          beforeDonate: false,
          afterDonate: false,
          beforeSwapReturnDelta: false,
          afterSwapReturnDelta: false,
          afterAddLiquidityReturnDelta: false,
          afterRemoveLiquidityReturnDelta: false
      });
  }
categories:
  - dynamic-fees
chains:
  - ethereum
license: MIT
flags:
  - afterInitialize
  - beforeSwap
  - afterSwap
properties:
  - dynamic-fee
  - custom-swap-data
  - vanilla-swap
docs: https://github.com/Keinberger/royalty-swap
status: experimental
added: 2026-08-27
updated: 2026-08-27
