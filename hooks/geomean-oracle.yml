slug: geomean-oracle
name: Geomean oracle
kind: pattern
tagline: Write a geometric-mean observation before any action that can move price or liquidity.
description: |
  The Uniswap GeomeanOracle example allows one oracle pool per pair (fee 0, max tick spacing).
  afterInitialize seeds the observation cardinality. beforeAddLiquidity forces full-range
  positions and writes a sample. beforeRemoveLiquidity always reverts so liquidity stays
  locked. beforeSwap updates the oracle then lets the swap proceed. Read observe() offchain
  or from another contract. UNLICENSED example — copy the full file including the Oracle
  library. Listing is not an audit.
source:
  repo: https://github.com/Uniswap/v4-periphery
  path: contracts/hooks/examples/GeomeanOracle.sol
  url: https://github.com/Uniswap/v4-periphery/blob/example-contracts/contracts/hooks/examples/GeomeanOracle.sol
solidity: |
  // SPDX-License-Identifier: UNLICENSED
  function getHookPermissions() public pure override returns (Hooks.Permissions memory) {
      return Hooks.Permissions({
          beforeInitialize: true,
          afterInitialize: true,
          beforeAddLiquidity: true,
          beforeRemoveLiquidity: true,
          afterAddLiquidity: false,
          afterRemoveLiquidity: false,
          beforeSwap: true,
          afterSwap: false,
          beforeDonate: false,
          afterDonate: false,
          beforeSwapReturnDelta: false,
          afterSwapReturnDelta: false,
          afterAddLiquidityReturnDelta: false,
          afterRemoveLiquidityReturnDelta: false
      });
  }

  function beforeSwap(address, PoolKey calldata key, IPoolManager.SwapParams calldata, bytes calldata)
      external
      override
      onlyByManager
      returns (bytes4, BeforeSwapDelta, uint24)
  {
      _updatePool(key);
      return (GeomeanOracle.beforeSwap.selector, BeforeSwapDeltaLibrary.ZERO_DELTA, 0);
  }

  function beforeRemoveLiquidity(address, PoolKey calldata, IPoolManager.ModifyLiquidityParams calldata, bytes calldata)
      external
      view
      override
      onlyByManager
      returns (bytes4)
  {
      revert OraclePoolMustLockLiquidity();
  }
