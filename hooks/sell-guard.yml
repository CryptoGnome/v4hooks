slug: sell-guard
name: Sell guard
kind: pattern
tagline: Sell cooldown blocks rapid dumps; repeat sells in a window pay ramp fee.
description: |
  First-party rewrite inspired by FairTrade (ETHNYC) and SafeSwap. Native-pair dynamic fee pool.
  beforeSwap enforces cooldownBlocks between sells and ramps fee after repeat sells in windowBlocks.
  Trader keyed via abi.encode(trader) in hookData. Complements buy-side AntiSnipe. Experimental.
  Listing is not an audit. Forge tests under test/SellGuard.t.sol.
source:
  repo: https://github.com/CryptoGnome/v4hooks
  path: contracts/SellGuard.sol
  url: https://github.com/CryptoGnome/v4hooks/blob/main/contracts/SellGuard.sol
solidity: |
  function getHookPermissions() public pure override returns (Hooks.Permissions memory) {
      return Hooks.Permissions({
          beforeInitialize: false,
          afterInitialize: true,
          beforeAddLiquidity: false,
          afterAddLiquidity: false,
          beforeRemoveLiquidity: false,
          afterRemoveLiquidity: false,
          beforeSwap: true,
          afterSwap: true,
          beforeDonate: false,
          afterDonate: false,
          beforeSwapReturnDelta: false,
          afterSwapReturnDelta: false,
          afterAddLiquidityReturnDelta: false,
          afterRemoveLiquidityReturnDelta: false
      });
  }
categories:
