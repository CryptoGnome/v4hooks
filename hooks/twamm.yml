slug: twamm
name: TWAMM
kind: pattern
tagline: Execute large orders over time by settling virtual TWAMM flow before each swap and LP change.
description: |
  Uniswap’s example TWAMM hook runs executeTWAMMOrders in beforeInitialize, beforeAddLiquidity,
  and beforeSwap so long-lived orders accrue between blocks and settle against the pool instead
  of dumping in one swap. Permissions must enable those three callbacks. The rest of the file
  (order storage, expiration) lives in the linked Solidity — copy the full contract from
  v4-periphery example-contracts, do not ship this excerpt. The example is UNLICENSED research
  code, not production. Confirm bytecode on hooklist if you route size. Listing is not an audit.
source:
  repo: https://github.com/Uniswap/v4-periphery
  path: contracts/hooks/examples/TWAMM.sol
  url: https://github.com/Uniswap/v4-periphery/blob/example-contracts/contracts/hooks/examples/TWAMM.sol
solidity: |
  // SPDX-License-Identifier: UNLICENSED
  function getHookPermissions() public pure override returns (Hooks.Permissions memory) {
      return Hooks.Permissions({
          beforeInitialize: true,
          afterInitialize: false,
          beforeAddLiquidity: true,
          beforeRemoveLiquidity: false,
          afterAddLiquidity: false,
          afterRemoveLiquidity: false,
          beforeSwap: true,
          afterSwap: false,
          beforeDonate: false,
          afterDonate: false,
          beforeSwapReturnDelta: false,
          afterSwapReturnDelta: false,
          afterAddLiquidityReturnDelta: false,
          afterRemoveLiquidityReturnDelta: false
      });
  }

  function beforeAddLiquidity(address, PoolKey calldata key, IPoolManager.ModifyLiquidityParams calldata, bytes calldata)
      external
      override
      onlyByManager
      returns (bytes4)
  {
      executeTWAMMOrders(key);
      return BaseHook.beforeAddLiquidity.selector;
  }

  function beforeSwap(address, PoolKey calldata key, IPoolManager.SwapParams calldata, bytes calldata)
      external
      override
      onlyByManager
      returns (bytes4, BeforeSwapDelta, uint24)
  {
      executeTWAMMOrders(key);
      return (BaseHook.beforeSwap.selector, BeforeSwapDeltaLibrary.ZERO_DELTA, 0);
  }
