slug: trading-days
name: Trading days
kind: pattern
tagline: Revert beforeSwap unless New York cash markets are open.
description: |
  horsefacts’ TradingDaysHook is the canonical calendar gate: beforeSwap reads State
  (OPEN, HOLIDAY, WEEKEND, AFTER_HOURS) from NY time, holidays, and DST, then reverts
  when closed. The first swap of an open day emits DingDingDing. Older Hooks.Calls API
  (beforeSwap only). MIT. Copy TradingDays.sol plus the calendar libraries from the repo;
  this excerpt is the hook surface. Timezone and L2 sequencer lag still apply. Listing
  is not an audit.
source:
  repo: https://github.com/horsefacts/trading-days
  path: src/TradingDaysHook.sol
  url: https://github.com/horsefacts/trading-days/blob/main/src/TradingDaysHook.sol
solidity: |
  // SPDX-License-Identifier: MIT
  function getHooksCalls() public pure override returns (Hooks.Calls memory) {
      return Hooks.Calls({
          beforeInitialize: false,
          afterInitialize: false,
          beforeModifyPosition: false,
          afterModifyPosition: false,
          beforeSwap: true,
          afterSwap: false,
          beforeDonate: false,
          afterDonate: false
      });
  }

  function beforeSwap(address sender, IPoolManager.PoolKey calldata, IPoolManager.SwapParams calldata)
      external
      override
      returns (bytes4)
  {
      State s = state();
      if (s == State.OPEN) {
          _ringOpeningBell(sender);
      } else if (s == State.HOLIDAY) {
          revert ClosedForHoliday(getHoliday());
      } else if (s == State.WEEKEND) {
          revert ClosedForWeekend();
      } else if (s == State.AFTER_HOURS) {
          revert AfterHours();
      }
      return BaseHook.beforeSwap.selector;
  }
