slug: allowlist-swap
name: AllowlistSwap
kind: pattern
tagline: Gate-controlled per-pool swap allowlist; beforeSwap reverts for unlisted traders.
description: |
  First-party teaching hook inspired by Uniswap Permissioned Pools. An immutable gate address sets
  allowed[poolId][trader]. beforeSwap resolves the trader from hookData (abi.encode address) or the
  swap sender and reverts Unauthorized if not listed. No permissions-adapter stack — minimal allowlist
  gate only. Experimental. Forge tests in test/AllowlistSwap.t.sol. Listing is not an audit.
source:
  repo: https://github.com/CryptoGnome/v4hooks
  path: contracts/AllowlistSwap.sol
  url: https://github.com/CryptoGnome/v4hooks/blob/main/contracts/AllowlistSwap.sol
solidity: |
  // SPDX-License-Identifier: MIT
  function _beforeSwap(address sender, PoolKey calldata key, SwapParams calldata, bytes calldata hookData)
      internal view override returns (bytes4, BeforeSwapDelta, uint24)
  {
      address trader = traderOf(sender, hookData);
      if (!allowed[key.toId()][trader]) revert Unauthorized();
      return (this.beforeSwap.selector, BeforeSwapDeltaLibrary.ZERO_DELTA, 0);
  }
categories:
