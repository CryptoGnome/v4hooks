name: SafeSwap
tagline: Anti-rug and anti-whale v4 hook with sell limits, cooldowns, and launch mode.
description: |
  SafeSwap is a production-oriented protection hook: sell-rate limits, cooldowns, progressive fees, and a launch protection mode with an immutable per-pool config. It is aimed at token teams who want Uniswap v4 without unbounded dumps on day one.

  Protection hooks can trap LPs or look like honeypots — read the parameters, not the marketing. Confirm the Arbitrum (and any later) address on hooklist. This sheet exists so “anti whale uniswap v4 hook” has a concrete project, not a generic blog post.
