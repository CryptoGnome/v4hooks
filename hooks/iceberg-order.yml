slug: iceberg-order
name: Iceberg
kind: pattern
tagline: Encrypted limit orders — size and direction stay hidden until the tick is crossed.
description: |
  Iceberg is the familiar v4 tick-crossing limit order, with the order book held in
  Fhenix CoFHE ciphertext instead of plaintext storage. Permissions are afterInitialize,
  beforeSwap and afterSwap; every callback is gated by onlyByManager.

  afterInitialize records the starting lower tick for the pool. afterSwap recomputes the
  ticks crossed since the last swap and walks them, filling resting orders in the
  direction opposite the swap — the file notes that a zeroForOne swap makes the pool gain
  token0, so limit fills invert the swap direction. That part is the standard
  LimitOrderHook shape.

  The FHE part lives in beforeSwap. Order amounts are euint128 handles rather than
  uint128, so a fill cannot settle until the coprocessor has decrypted the amount.
  beforeSwap drains a per-pool decryption Queue, peeking each pending handle and
  executing whatever has become available before the swap proceeds. Balances are held as
  IFHERC20, an encrypted ERC-20, so a resting order's size is never readable on-chain.

  Two consequences worth understanding before copying it. Fills are asynchronous: an
  order becomes claimable a decryption round after the tick is crossed, not in the same
  transaction. And beforeSwap does unbounded work proportional to queue depth, so a
  congested pool pays for other people's pending decryptions — the same
  tick-walk gas exposure the plaintext limit order hooks have, plus the queue.

  Depends on Fhenix CoFHE, so it only runs where that coprocessor is deployed.
  Experimental, unaudited.
