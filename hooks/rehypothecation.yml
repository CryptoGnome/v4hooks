slug: rehypothecation
name: ReHypothecationHook
kind: pattern
tagline: Park idle LP in yield sources, JIT a hook-owned position on beforeSwap, unwind afterSwap.
description: |
  OpenZeppelin’s ReHypothecationHook (MIT) parks idle LP in external yield sources (ERC-4626 or
  lending) and JIT-injects a hook-owned full-range position on beforeSwap, then unwinds it on
  afterSwap and settles PoolManager deltas back to the vaults. Users mint and redeem the hook’s
  ERC20 via addReHypothecatedLiquidity; they do not add liquidity through PoolManager.
  beforeInitialize binds a single PoolKey. You implement getCurrencyYieldSource and the deposit
  or withdraw adapters. Experimental: yield-source risk, PoolManager reserve timing, and leveraged
  liquidity notes are in the file. Copy the full file. Listing is not an audit.
source:
