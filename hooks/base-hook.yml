slug: base-hook
name: BaseHook
kind: pattern
tagline: Inherit this, declare permissions, override only the callbacks you actually implement.
description: |
  Every custom Uniswap v4 hook should start from BaseHook. PoolManager only calls the
  functions whose bits are set in the hook address. BaseHook stores the PoolManager,
  checks msg.sender, and routes each IHooks entrypoint to an internal _callback that
  reverts with HookNotImplemented until you override it. getHookPermissions must match
  those overrides or the constructor’s validateHookAddress fails. Copy this pattern,
  flip the permission bits you need, and implement the matching _beforeSwap (or other)
  function. This is the Uniswap v4-hooks-public MIT file, not a full AMM. Listing is
  not an audit. Confirm the import path against the v4-periphery version you compile.
source:
  repo: https://github.com/Uniswap/v4-hooks-public
  path: src/base/BaseHook.sol
  url: https://github.com/Uniswap/v4-hooks-public/blob/main/src/base/BaseHook.sol
solidity: |
  // SPDX-License-Identifier: MIT
  // Excerpt: constructor + swap dispatch. Full file: source.url
  abstract contract BaseHook is IHooks, ImmutableState {
      error HookNotImplemented();

      constructor(IPoolManager _manager) ImmutableState(_manager) {
          validateHookAddress(this);
      }

      function getHookPermissions() public pure virtual returns (Hooks.Permissions memory);

      function validateHookAddress(BaseHook _this) internal pure virtual {
          Hooks.validateHookPermissions(_this, getHookPermissions());
      }

      function beforeSwap(address sender, PoolKey calldata key, SwapParams calldata params, bytes calldata hookData)
          external
          onlyPoolManager
          returns (bytes4, BeforeSwapDelta, uint24)
      {
          return _beforeSwap(sender, key, params, hookData);
      }

      function _beforeSwap(address, PoolKey calldata, SwapParams calldata, bytes calldata)
          internal
          virtual
          returns (bytes4, BeforeSwapDelta, uint24)
      {
          revert HookNotImplemented();
      }
  }
