slug: base-hook
name: BaseHook
kind: pattern
tagline: Inherit this, declare permissions, gate callbacks with onlyPoolManager.
description: |
  Start every custom Uniswap v4 hook from OpenZeppelin’s BaseHook (MIT). PoolManager
  only calls functions whose bits are set in the hook address. BaseHook stores the
  PoolManager, reverts NotPoolManager unless msg.sender is that singleton, and routes
  each IHooks entrypoint to an internal _callback that reverts HookNotImplemented until
  you override it. getHookPermissions must match those overrides or constructor
  validation fails. Flip the bits you need, implement the matching _beforeSwap (or other)
  function, and keep return-delta flags in sync. Listing is not an audit. The library is
  experimental — still run the secure-hooks checklist before you ship.
source:
  repo: https://github.com/OpenZeppelin/uniswap-hooks
  path: src/base/BaseHook.sol
  url: https://github.com/OpenZeppelin/uniswap-hooks/blob/master/src/base/BaseHook.sol
solidity: |
  // SPDX-License-Identifier: MIT
  // OpenZeppelin Uniswap Hooks — excerpt. Full file: source.url
  abstract contract BaseHook is IHooks {
      IPoolManager public immutable poolManager;
      error HookNotImplemented();
      error NotPoolManager();

      constructor(IPoolManager _poolManager) {
          poolManager = _poolManager;
          _validateHookAddress(this);
      }

      modifier onlyPoolManager() {
          if (msg.sender != address(poolManager)) revert NotPoolManager();
          _;
      }

      function getHookPermissions() public pure virtual returns (Hooks.Permissions memory permissions);

      function beforeSwap(address sender, PoolKey calldata key, SwapParams calldata params, bytes calldata hookData)
          external
          onlyPoolManager
          returns (bytes4, BeforeSwapDelta, uint24)
      {
          return _beforeSwap(sender, key, params, hookData);
      }

      function _beforeSwap(address, PoolKey calldata, SwapParams calldata, bytes calldata)
          internal
          virtual
          returns (bytes4, BeforeSwapDelta, uint24)
      {
          revert HookNotImplemented();
      }
  }
