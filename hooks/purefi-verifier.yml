slug: purefi-verifier
name: VerifierHook
kind: product
tagline: Gate every pool action behind an off-chain AML proof checked in the callback.
description: |
  PureFi's VerifierHook is a compliance gate wired into almost every callback v4 offers:
  beforeAddLiquidity, afterAddLiquidity, beforeRemoveLiquidity, afterRemoveLiquidity,
  beforeSwap, afterSwap and beforeDonate. Seven bits is a lot of surface, and the reason
  is that a compliance rule which only covers swaps is trivially sidestepped by moving
  liquidity instead.

  The hook holds an immutable IPureFiVerifier and a PureFiHookWhitelist. Callers hand it
  a signed PureFi package — an off-chain AML/KYC attestation — which the callback decodes
  through PureFiDataLibrary and checks against a ruleId mapping before letting the action
  through. Roles are OpenZeppelin AccessControl: ISSUER, MARKET_MAKER, ROUTER and QUOTER,
  plus a routersWhitelist so only sanctioned routers can reach the pool at all.

  That last part is the important structural detail. The proof travels as hookData, and
  the repo ships its own PureFiSwapRouter and PureFiModifyLiquidityRouter to carry it, so
  this is not a pool you can trade against with a stock router — the swap path is part of
  the product. Read the routers alongside the hook; the hook alone will not tell you how
  the proof gets there.

  Treat this as a reference for how a permissioned pool is actually assembled — the
  verifier is PureFi's own service, so the pattern is portable but the dependency is not.
  Gating all four liquidity callbacks and both swap callbacks is the transferable idea.

  Unaudited in this repository.
source:
