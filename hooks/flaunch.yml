slug: flaunch
name: Flaunch
kind: product
tagline: "PositionManager hook: beforeSwap runs the internal swap pool; afterSwap distributes creator fees."
description: |
  Flaunch’s PositionManager is a Uniswap v4 hook (MIT). Permissions: block external
  initialize, InternalSwapPool on beforeSwap + beforeSwapReturnDelta, FeeDistributor and
  BidWall on afterSwap + afterSwapReturnDelta, liquidity/donate event tracking. You do not
  copy this to “build Flaunch” — you read how a launchpad declares a wide permission mask
  and splits work across callbacks. Full PositionManager.sol is large; start at
  getHookPermissions then follow the comments in square brackets. Listing is not an audit.
source:
  repo: https://github.com/flayerlabs/flaunchgg-contracts
  path: src/contracts/PositionManager.sol
  url: https://github.com/flayerlabs/flaunchgg-contracts/blob/main/src/contracts/PositionManager.sol
solidity: |
  // SPDX-License-Identifier: MIT
  function getHookPermissions() public pure override returns (Hooks.Permissions memory) {
      return Hooks.Permissions({
          beforeInitialize: true, // Prevent initialize
          afterInitialize: false,
          beforeAddLiquidity: false,
          afterAddLiquidity: true, // [EventTracking]
          beforeRemoveLiquidity: false,
          afterRemoveLiquidity: true, // [EventTracking]
          beforeSwap: true, // [InternalSwapPool]
          afterSwap: true, // [FeeDistributor], [InternalSwapPool], [BidWall], [EventTracking]
          beforeDonate: false,
          afterDonate: true, // [EventTracking]
          beforeSwapReturnDelta: true, // [InternalSwapPool]
          afterSwapReturnDelta: true, // [FeeDistributor]
          afterAddLiquidityReturnDelta: false,
          afterRemoveLiquidityReturnDelta: false
      });
  }
categories:
