slug: velp
name: veLP
kind: pattern
tagline: "Curve-style vote-escrow on a v4 position: lock ticks, block early withdraw in beforeModifyPosition."
description: |
  kadenzipfel ports VotingEscrow onto a Uniswap v4 hook. afterInitialize stores the PoolId.
  beforeModifyPosition lets unrelated ticks through, but if sender is modifying their locked
  range it requires liquidityDelta > 0 until lock end. afterModifyPosition checkpoints ve
  weight from the position’s liquidity. Early Hooks.Calls API (modifyPosition, not add/remove).
  AGPL-3.0 — copy the full VotingEscrow.sol. Map modifyPosition to today’s
  beforeAddLiquidity / beforeRemoveLiquidity if you port forward. Listing is not an audit.
source:
  repo: https://github.com/kadenzipfel/veLP
  path: src/VotingEscrow.sol
  url: https://github.com/kadenzipfel/veLP/blob/main/src/VotingEscrow.sol
solidity: |
  // SPDX-License-Identifier: AGPL-3.0-or-later
  function getHooksCalls() public pure override returns (Hooks.Calls memory) {
      return Hooks.Calls({
          beforeInitialize: false,
          afterInitialize: true,
          beforeModifyPosition: true,
          afterModifyPosition: true,
          beforeSwap: false,
          afterSwap: false,
          beforeDonate: false,
          afterDonate: false
      });
  }

  function beforeModifyPosition(
      address sender,
      PoolKey calldata,
      IPoolManager.ModifyPositionParams calldata modifyPositionParams
  ) external view override poolManagerOnly returns (bytes4) {
      LockTicks memory lockTicks_ = lockTicks[sender];
      if (
          lockTicks_.lowerTick != modifyPositionParams.tickLower
              || lockTicks_.upperTick != modifyPositionParams.tickUpper
      ) {
          return VotingEscrow.beforeModifyPosition.selector;
      }
      LockedBalance memory locked_ = locked[sender];
      require(
          modifyPositionParams.liquidityDelta > 0 || locked_.end <= block.timestamp,
          "Can't withdraw before lock end"
      );
      return VotingEscrow.beforeModifyPosition.selector;
  }
