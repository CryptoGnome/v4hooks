slug: unimon
name: Unimon
tagline: NFT battle game whose mint and state live inside a Uniswap v4 hook.
description: |
  Unimon is a game that uses a v4 hook so swapping a specific pool can mint or manage NFTs. That is a different job than a fee or oracle hook: the pool is the game loop. Builders looking for prior art on “can a hook mint an NFT on swap?” should read this before inventing a new callback maze.

  Gaming hooks are experimental by nature. Check the live app, chain, and whether the NFT contract still matches the hook. Listing here does not mean the game is maintained — it means the pattern shipped and is searchable.
