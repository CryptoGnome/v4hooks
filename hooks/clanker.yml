slug: clanker
name: Clanker
kind: product
tagline: "Dynamic-fee launch hook: beforeSwap sets fee, claims, runs an MEV module, then takes protocol delta."
description: |
  ClankerHook is MIT production code. getHookPermissions enables initialize, add-liquidity
  (blocked while the MEV module is hot), beforeSwap/afterSwap, and both swap return-delta
  bits so the hook can mint protocol fee into its PoolManager account. _beforeSwap sets the
  LP fee, claims, optionally runs mevModule.beforeSwap, then uses BeforeSwapDelta on paired
  token. Do not reimplement Clanker to “launch a coin” — use their factory. Excerpt is how
  a launchpad hook takes fee-on-delta. Full file at the permalink. Listing is not an audit.
source:
  repo: https://github.com/clanker-devco/v4-contracts
  path: src/hooks/ClankerHook.sol
  url: https://github.com/clanker-devco/v4-contracts/blob/main/src/hooks/ClankerHook.sol
solidity: |
  // SPDX-License-Identifier: MIT
  function getHookPermissions() public pure override returns (Hooks.Permissions memory) {
      return Hooks.Permissions({
          beforeInitialize: true,
          afterInitialize: false,
          beforeAddLiquidity: true,
          afterAddLiquidity: false,
          beforeRemoveLiquidity: false,
          afterRemoveLiquidity: false,
          beforeSwap: true,
          afterSwap: true,
          beforeDonate: false,
          afterDonate: false,
          beforeSwapReturnDelta: true,
          afterSwapReturnDelta: true,
          afterAddLiquidityReturnDelta: false,
          afterRemoveLiquidityReturnDelta: false
      });
  }

  function _beforeSwap(
      address,
      PoolKey calldata poolKey,
      IPoolManager.SwapParams calldata swapParams,
      bytes calldata mevModuleSwapData
  ) internal virtual override returns (bytes4, BeforeSwapDelta delta, uint24) {
      _setFee(poolKey, swapParams);
      _hookFeeClaim(poolKey);
      _lpLockerFeeClaim(poolKey);
      _runMevModule(poolKey, swapParams, mevModuleSwapData);
      // mint protocol fee as BeforeSwapDelta when swapping for/against the clanker
      return (BaseHook.beforeSwap.selector, delta, 0);
  }
